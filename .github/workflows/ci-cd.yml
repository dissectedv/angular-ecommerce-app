name: 🚀 Deploy e Verificação no Kubernetes (via EC2)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      NAMESPACE: app-demo
      BACKEND_IMAGE: ${{ secrets.REGISTRY_USERNAME }}/backend
      FRONTEND_IMAGE: ${{ secrets.REGISTRY_USERNAME }}/frontend
      EC2_IP: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      # 1️⃣ Checkout do código
      - name: 🧩 Baixar código
        uses: actions/checkout@v3

      # 2️⃣ Configurar acesso SSH à instância EC2
      - name: 🔑 Configurar chave SSH
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key.pem
          chmod 600 ec2_key.pem
          ssh-keyscan -H $EC2_IP >> ~/.ssh/known_hosts

      # 3️⃣ Login no Docker Hub
      - name: 🐳 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 4️⃣ Build e Push das Imagens
      - name: 🏗️ Build e Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: 🏗️ Build e Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # 5️⃣ Fazer deploy no cluster dentro da EC2
      - name: ☸️ Aplicar Manifests no K3s remoto
        run: |
          ssh -i ec2_key.pem $EC2_USER@$EC2_IP << 'EOF'
            cd ~/k8s
            echo "📦 Atualizando imagens..."
            kubectl set image deployment/backend pedrobrantis/backend=${{ env.BACKEND_IMAGE }}:latest -n app-demo
            kubectl set image deployment/frontend web=${{ env.FRONTEND_IMAGE }}:latest -n app-demo
            kubectl rollout restart deployment/backend -n app-demo
            kubectl rollout restart deployment/frontend -n app-demo
            kubectl get pods -n app-demo
          EOF

      # 6️⃣ Verificar funcionamento
      - name: ✅ Testar endpoints públicos
        run: |
          echo "🌐 Testando backend..."
          curl -s -o /dev/null -w "%{http_code}\n" http://${{ env.EC2_IP }}:30045/api/v1/products?limit=3
          echo "🌐 Testando frontend..."
          curl -s -o /dev/null -w "%{http_code}\n" http://${{ env.EC2_IP }}:30050
          echo "🚀 Deploy finalizado com sucesso!"