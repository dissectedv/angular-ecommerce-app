name: Build, Push and Deploy on Kubernetes (EC2)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    env:
      BACKEND_IMAGE: ${{ secrets.REGISTRY_USERNAME }}/backend
      FRONTEND_IMAGE: ${{ secrets.REGISTRY_USERNAME }}/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-to-ec2:
    name: Deploy to Kubernetes on EC2
    runs-on: ubuntu-latest
    needs: build-and-push-images

    env:
      NAMESPACE: app-demo
      BACKEND_IMAGE: ${{ secrets.REGISTRY_USERNAME }}/backend
      FRONTEND_IMAGE: ${{ secrets.REGISTRY_USERNAME }}/frontend
      EC2_IP: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - name: Configure SSH access
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 --decode > ec2_key.pem
          chmod 600 ec2_key.pem
          mkdir -p ~/.ssh
          ssh-keyscan -H $EC2_IP >> ~/.ssh/known_hosts

      - name: Apply Kubernetes manifests on remote EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem $EC2_USER@$EC2_IP << 'EOF'
            mkdir -p ~/k8s
            cd ~/k8s

            echo "🔄 Updating backend and frontend images..."
            kubectl set image deployment/backend app=${{ env.BACKEND_IMAGE }}:latest -n app-demo
            kubectl set image deployment/frontend web=${{ env.FRONTEND_IMAGE }}:latest -n app-demo

            echo "♻️ Restarting deployments..."
            kubectl rollout restart deployment/backend -n app-demo
            kubectl rollout restart deployment/frontend -n app-demo

            echo "🧹 Cleaning old MySQL jobs..."
            kubectl delete job -n app-demo --all || true

            echo "📥 Reapplying MySQL import job..."
            if [ -f "50-job-mysql-import.yaml" ]; then
              kubectl apply -f 50-job-mysql-import.yaml -n app-demo
            else
              echo "⚠️ Skipped: 50-job-mysql-import.yaml not found."
            fi

            echo "✅ Checking pod status..."
            kubectl get pods -n app-demo
          EOF

      - name: Verify public endpoints
        run: |
          echo "Testing backend API..."
          curl -s -o /dev/null -w "%{http_code}\n" http://${{ env.EC2_IP }}:30045/api/v1/products?limit=3
          echo "Testing frontend app..."
          curl -s -o /dev/null -w "%{http_code}\n" http://${{ env.EC2_IP }}:30050
          echo "✅ Deployment completed successfully."